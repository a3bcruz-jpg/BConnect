name: BConnect Android Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/incident-ops-live

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ''

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK layout:"
            find /usr/local/lib/android /opt/android-sdk "$HOME/Android" -maxdepth 6 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          SDK_ROOT="$(cd "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")" && pwd)"
          if [ ! -x "$ADB" ]; then
            ADB="$(find "$SDK_ROOT/platform-tools" -type f -name adb -print -quit 2>/dev/null || true)"
          fi
          test -n "$ADB"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
            echo "ADB=$ADB"
          } >> "$GITHUB_ENV"
          {
            echo "$(dirname "$SDKMANAGER")"
            echo "$(dirname "$ADB")"
          } >> "$GITHUB_PATH"

      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          command -v adb
          adb version
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        env:
          CAPACITOR_SERVER_URL: https://b-connect-virid.vercel.app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bconnect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
