name: BConnect Android Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/incident-ops-live

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOTS=(
            "$ANDROID_SDK_ROOT"
            "/opt/android-sdk"
            "$HOME/Android/Sdk"
          )
          SDKMANAGER=""
          for root in "${SDK_ROOTS[@]}"; do
            if [ -d "$root" ]; then
              SDKMANAGER="$(find "$root" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
              if [ -n "$SDKMANAGER" ]; then
                ANDROID_SDK_ROOT="$root"
                break
              fi
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK directory contents:"
            find /usr/local/lib/android /opt/android-sdk "$HOME/Android" -maxdepth 5 -type f \( -name sdkmanager -o -name adb \) -print 2>/dev/null || true
            echo "sdkmanager was not found"
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          ADB="$(find "$ANDROID_SDK_ROOT/platform-tools" -type f -name adb -print -quit 2>/dev/null || true)"
          test -n "$ADB"
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
            echo "ADB=$ADB"
          } >> "$GITHUB_ENV"
          {
            echo "$SDKMANAGER_DIR"
            echo "$(dirname "$ADB")"
          } >> "$GITHUB_PATH"

      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          test -x "$ADB"
          "$ADB" version
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        env:
          CAPACITOR_SERVER_URL: https://b-connect-virid.vercel.app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bconnect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
